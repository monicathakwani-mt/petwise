<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetWise - Your Trusted Companion for Everyday Pet Care</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ==========================================================================
       1. Design Tokens & CSS Custom Properties
       ========================================================================== */
    :root {
      --bg-canvas: #FAF8F5;
      --bg-surface: #FFFFFF;
      --brand-primary: #1E4D3A;     /* Sage Forest */
      --brand-secondary: #E07A5F;   /* Warm Amber */
      --brand-soft: #70A9A1;        /* Soft Canopy */
      --text-main: #1D2A32;         /* Deep Slate */
      --text-muted: #5A6B68;        /* Muted Moss */
      --alert-safe: #2D6A4F;
      --border-subtle: #E8E3D9;
      --shadow-sm: 0 2px 8px rgba(30, 77, 58, 0.06);
      --shadow-md: 0 4px 16px rgba(30, 77, 58, 0.08);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ==========================================================================
       2. Header & Logo Presentation Container
       ========================================================================== */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 24px 16px;
      box-shadow: var(--shadow-sm);
    }

    .brand-header-container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .logo-system-svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-canvas);
    }

    /* ==========================================================================
       3. Main App Layout & Chat UI
       ========================================================================== */
    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 32px auto;
      padding: 0 16px;
    }

    .chat-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      height: 600px;
      overflow: hidden;
    }

    .chat-header {
      background-color: var(--brand-primary);
      color: #FFFFFF;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.125rem;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--brand-primary);
      color: #FFFFFF;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background-color: #F0EDE6;
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    .chat-input-area {
      padding: 16px 24px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 12px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      background-color: var(--bg-canvas);
    }

    .chat-input:focus {
      border-color: var(--brand-primary);
    }

    .send-btn {
      background-color: var(--brand-secondary);
      color: #FFFFFF;
      border: none;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .alert-banner {
      display: none;
      background-color: #F8D7DA;
      color: #721C24;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-header-container">
      <svg class="logo-system-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%">
        <defs>
          <style>
            .title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 22px; fill: #1E4D3A; }
            .subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #1E4D3A; opacity: 0.8; }
            .brand-pet { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 42px; fill: #1E4D3A; }
            .brand-wise { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 42px; fill: #E07A5F; }
            .tagline { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; fill: #1E4D3A; }
            .divider { stroke: #E0E0E0; stroke-width: 1; }
          </style>
        </defs>

        <line x1="400" y1="40" x2="400" y2="635" class="divider" />
        <line x1="800" y1="40" x2="800" y2="635" class="divider" />

        <g transform="translate(40, 40)">
          <text x="0" y="20" class="subtitle">Concept 1</text>
          <text x="0" y="45" class="title">Abstract Hybrid</text>

          <g transform="translate(75, 120)">
            <path d="M 100 0 C 160 0 200 40 200 100 C 200 170 100 230 100 230 C 100 230 0 170 0 100 C 0 40 40 0 100 0 Z" 
                  fill="none" stroke="#1E4D3A" stroke-width="16" stroke-linejoin="round"/>
            <path d="M 100 220 L 100 160" stroke="#1E4D3A" stroke-width="12" stroke-linecap="round"/>
            <path d="M 100 160 C 80 160 65 140 75 120 C 85 100 115 100 125 120 C 135 140 120 160 100 160 Z" fill="#1E4D3A"/>
            <circle cx="60" cy="100" r="14" fill="#1E4D3A"/>
            <circle cx="85" cy="70" r="14" fill="#1E4D3A"/>
            <circle cx="120" cy="70" r="14" fill="#1E4D3A"/>
            <path d="M 150 95 Q 150 80 135 80 Q 150 80 150 65 Q 150 80 165 80 Q 150 80 150 95 Z" fill="#E07A5F"/>
          </g>

          <g transform="translate(60, 430)">
            <text x="0" y="0"><tspan class="brand-pet">Pet</tspan><tspan class="brand-wise">Wise</tspan></text>
            <text x="0" y="25" class="tagline">Intelligent Pet Care Companion</text>
          </g>
        </g>

        <g transform="translate(440, 40)">
          <text x="0" y="20" class="subtitle">Concept 2</text>
          <text x="0" y="45" class="title">Friendly Emblem</text>

          <g transform="translate(60, 110)">
            <rect x="0" y="0" width="200" height="200" rx="100" fill="#1E4D3A"/>
            <path d="M 60 140 C 60 110 80 90 100 110 C 120 90 140 110 140 140 C 140 165 100 185 100 185 C 100 185 60 165 60 140 Z" 
                  fill="none" stroke="#FAF8F5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 70 115 C 60 100 50 70 70 55 C 85 45 95 65 95 85" 
                  fill="none" stroke="#FAF8F5" stroke-width="8" stroke-linecap="round"/>
            <path d="M 130 115 C 140 100 155 75 140 60 C 130 50 120 65 115 85" 
                  fill="none" stroke="#FAF8F5" stroke-width="8" stroke-linecap="round"/>
            <path d="M 100 60 Q 100 45 85 45 Q 100 45 100 30 Q 100 45 115 45 Q 100 45 100 60 Z" fill="#E07A5F"/>
          </g>

          <g transform="translate(40, 430)">
            <text x="0" y="0"><tspan class="brand-pet">Pet</tspan><tspan class="brand-wise">Wise</tspan></text>
            <text x="0" y="25" class="tagline">Intelligent Pet Care Companion</text>
          </g>
        </g>

        <g transform="translate(840, 40)">
          <text x="0" y="20" class="subtitle">Concept 3</text>
          <text x="0" y="45" class="title">Minimalist Monogram</text>

          <g transform="translate(30, 240)">
            <rect x="25" y="20" width="14" height="90" fill="#1E4D3A" rx="7"/>
            <path d="M 15 70 C -5 60 0 40 25 50" fill="none" stroke="#1E4D3A" stroke-width="10" stroke-linecap="round"/>
            <path d="M 15 90 C -5 80 0 60 25 70" fill="none" stroke="#1E4D3A" stroke-width="10" stroke-linecap="round"/>
            <path d="M 32 30 C 32 -10 90 -10 90 30 C 90 60 32 60 32 60" 
                  fill="none" stroke="#E07A5F" stroke-width="14" stroke-linecap="round"/>
            <path d="M 75 0 Q 75 -12 63 -12 Q 75 -12 75 -24 Q 75 -12 87 -12 Q 75 -12 75 0 Z" fill="#E07A5F"/>

            <text x="95" y="85" class="brand-pet">et<tspan class="brand-wise">Wise</tspan></text>
            <text x="25" y="125" class="tagline">Intelligent Pet Care Companion</text>
          </g>

          <g transform="translate(140, 460)">
            <rect x="10" y="20" width="10" height="60" fill="#1E4D3A" rx="5"/>
            <path d="M 5 55 C -8 48 -4 32 10 40" fill="none" stroke="#1E4D3A" stroke-width="7" stroke-linecap="round"/>
            <path d="M 5 70 C -8 63 -4 47 10 55" fill="none" stroke="#1E4D3A" stroke-width="7" stroke-linecap="round"/>
            <path d="M 15 27 C 15 -2 55 -2 55 27 C 55 50 15 50 15 50" fill="none" stroke="#E07A5F" stroke-width="10" stroke-linecap="round"/>
            <path d="M 45 5 Q 45 -4 36 -4 Q 45 -4 45 -13 Q 45 -4 54 -4 Q 45 -4 45 5 Z" fill="#E07A5F"/>
          </g>
        </g>
      </svg>
    </div>
  </header>

  <main>
    <div id="alertBanner" class="alert-banner"></div>

    <div class="chat-card">
      <div class="chat-header">
        <h2>PetWise Care Assistant</h2>
        <span style="font-size: 0.85rem; opacity: 0.9;">AI Decision Support</span>
      </div>

      <div id="chatMessages" class="chat-messages">
        <div class="message assistant">
          Hello! I'm your PetWise companion. How can I assist you with your pet's care, nutrition, or health today?
        </div>
      </div>

      <div id="typingIndicator" class="typing-indicator" style="padding: 0 24px 8px 24px;">
        PetWise is thinking...
      </div>

      <div class="chat-input-area">
        <input type="text" id="userInput" class="chat-input" placeholder="Type your message here..." />
        <button id="sendBtn" class="send-btn">Send</button>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const chatMessages = document.getElementById('chatMessages');
      const typingIndicator = document.getElementById('typingIndicator');
      const alertBanner = document.getElementById('alertBanner');

      function appendMessage(role, text) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', role);
        if (role === 'assistant' && typeof marked !== 'undefined') {
          messageDiv.innerHTML = marked.parse(text);
        } else {
          messageDiv.textContent = text;
        }
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function displayAlert(msg) {
        alertBanner.textContent = msg;
        alertBanner.style.display = 'block';
        setTimeout(() => {
          alertBanner.style.display = 'none';
        }, 5000);
      }

      sendBtn.addEventListener('click', handleSend);
      userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
      });

      async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';
        typingIndicator.style.display = 'block';
        sendBtn.disabled = true;

        try {
          const apiUrl = ''; // Insert your API endpoint here
          const bearerToken = ''; // Insert Bearer Token if needed

          if (!apiUrl) {
            // Mock response if API URL is not set
            setTimeout(() => {
              typingIndicator.style.display = 'none';
              appendMessage('assistant', `Thank you for your message: "${text}". I am currently in demonstration mode.`);
              sendBtn.disabled = false;
            }, 1000);
            return;
          }

          const headers = { 'Content-Type': 'application/json' };
          if (bearerToken) {
            headers['Authorization'] = `Bearer ${bearerToken}`;
          }

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({
              input_value: text,
              output_type: 'chat',
              input_type: 'chat',
              tweaks: {}
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP Error ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();

          let assistantText = '';
          if (data.outputs?.[0]?.outputs?.[0]?.results?.message?.text) {
            assistantText = data.outputs[0].outputs[0].results.message.text;
          } else if (data.result?.message) {
            assistantText = data.result.message;
          } else {
            assistantText = JSON.stringify(data, null, 2);
          }

          typingIndicator.style.display = 'none';
          appendMessage('assistant', assistantText);

        } catch (error) {
          console.error('Langflow Request Error:', error);
          typingIndicator.style.display = 'none';
          displayAlert(`Unable to complete request: ${error.message}. Please check your API configuration or network connection.`);
        } finally {
          sendBtn.disabled = false;
        }
      }
    });
  </script>
</body>
</html>
